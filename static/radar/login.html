<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Gem Radar</title><link rel="stylesheet" href="/radar.css"></head>
<body><main><h1>Gem Radar</h1><p>Sign in to your private Solana research dashboard.</p><p role="alert">{{message}}</p><form method="post" action="/login"><input type="hidden" name="nonce" value="{{nonce}}"><p><label>Username <input name="username" value="{{username}}" autocomplete="username" required maxlength="100"></label></p><p><label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="500"></label></p><button type="submit">Sign in</button></form><p>Your session lasts eight hours.</p></main></body></html>
